<svg xmlns="http://www.w3.org/2000/svg" width="320" height="64" viewBox="0 0 320 64" role="img" aria-label="打开个人网站">
  <defs>
    <style>
      .blink{animation:bl 1s steps(1,end) infinite}
      @keyframes bl{0%,49.9%{opacity:1}50%,100%{opacity:0}}
      .slide{animation:sl 1.4s steps(3,end) infinite}
      @keyframes sl{0%{transform:translateX(0)}100%{transform:translateX(9px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none}}
    </style>
  </defs>
  <rect x="0" y="0" width="320" height="64" fill="#3D1B16"/>
  <rect x="4" y="4" width="312" height="56" fill="#22100F"/>
  <rect x="4" y="4" width="312" height="2" fill="#FF3B1F" opacity="0.85"/>
  <rect x="4" y="58" width="312" height="2" fill="#C21B00"/>
  <rect class="blink" x="16" y="26" width="10" height="10" fill="#FF3B1F"/>
  <text x="38" y="42" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#FFE9D6">ENTER SITE</text>
  <g class="slide">
    <rect x="248" y="29" width="24" height="6" fill="#FF3B1F"/>
    <rect x="264" y="23" width="6" height="18" fill="#FF3B1F"/>
    <rect x="258" y="26" width="6" height="12" fill="#FF3B1F"/>
  </g>
</svg>
