<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-labelledby="ft fd">
  <title id="ft">Yourstandby 状态栏：LV.03、HP 7/10、持续构建中</title>
  <desc id="fd">像素状态栏，血条逐格充能，底部方块跑马灯</desc>
  <defs>
    <style>
      .hp{opacity:0;animation:hp 5s steps(1,end) infinite}
      @keyframes hp{0%{opacity:0}8%{opacity:1}86%{opacity:1}92%{opacity:0}100%{opacity:0}}
      .marquee{animation:marq 8s linear infinite}
      @keyframes marq{0%{transform:translateX(0)}100%{transform:translateX(64px)}}
      .blink{animation:blink 1.2s steps(1,end) infinite}
      @keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <rect width="1200" height="96" fill="#22100F"/>
  <rect y="0" width="1200" height="2" fill="#3D1B16"/>
  <rect x="48" y="38" width="6" height="6" fill="#FF3B1F" class="blink"/>
  <text x="66" y="50" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="16" letter-spacing="3" fill="#FFE9D6">LV.03 · BUILDER</text>
  <text x="330" y="50" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="16" letter-spacing="3" fill="#8A6A64">HP</text>
  <rect x="760" y="44" width="14" height="14" fill="#FF3B1F" class="hp" style="animation-delay:0.00s"/>
  <rect x="780" y="44" width="14" height="14" fill="#FF3B1F" class="hp" style="animation-delay:0.12s"/>
  <rect x="800" y="44" width="14" height="14" fill="#FF3B1F" class="hp" style="animation-delay:0.24s"/>
  <rect x="820" y="44" width="14" height="14" fill="#FF3B1F" class="hp" style="animation-delay:0.36s"/>
  <rect x="840" y="44" width="14" height="14" fill="#FF3B1F" class="hp" style="animation-delay:0.48s"/>
  <rect x="860" y="44" width="14" height="14" fill="#FF3B1F" class="hp" style="animation-delay:0.60s"/>
  <rect x="880" y="44" width="14" height="14" fill="#FF3B1F" class="hp" style="animation-delay:0.72s"/>
  <rect x="900" y="44" width="14" height="14" fill="#3D1B16"/>
  <rect x="920" y="44" width="14" height="14" fill="#3D1B16"/>
  <rect x="940" y="44" width="14" height="14" fill="#3D1B16"/>
  <text x="980" y="50" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="16" letter-spacing="3" fill="#8A6A64">7 / 10</text>
  <g class="marquee">
    <rect x="0" y="78" width="16" height="8" fill="#FF3B1F"/>
    <rect x="24" y="78" width="16" height="8" fill="#C21B00"/>
    <rect x="48" y="78" width="16" height="8" fill="#FFB000"/>
    <rect x="72" y="78" width="16" height="8" fill="#C21B00"/>
  </g>
  <rect x="0" y="86" width="1200" height="8" fill="#16090A"/>
</svg>
