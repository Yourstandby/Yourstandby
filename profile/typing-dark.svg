<svg xmlns="http://www.w3.org/2000/svg" width="760" height="96" viewBox="0 0 760 96" role="img" aria-labelledby="tt td">
  <title id="tt">Keep building. Keep burning.</title>
  <desc id="td">逐字符打字机效果的标语，带方块光标</desc>
  <defs>
    <mask id="reveal" maskUnits="userSpaceOnUse" x="80" y="0" width="600" height="96">
      <rect class="grow" x="94" y="0" width="572" height="96" fill="#fff"/>
    </mask>
    <style>
      .grow{transform-box:fill-box;transform-origin:left center;animation:type 6s steps(26,end) infinite}
      @keyframes type{0%{transform:scaleX(0)}58%{transform:scaleX(1)}92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
      .caret{animation:caret 6s steps(26,end) infinite}
      @keyframes caret{0%{transform:translateX(0)}58%{transform:translateX(572px)}92%{transform:translateX(572px)}100%{transform:translateX(0)}}
      .blink{animation:blink 1s steps(1,end) infinite}
      @keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <rect x="64" y="24" width="4" height="48" fill="#FF3B1F"/>
  <rect x="692" y="24" width="4" height="48" fill="#FF3B1F"/>
  <g mask="url(#reveal)">
    <text x="94" y="58" textLength="572" lengthAdjust="spacing" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="28" letter-spacing="4" fill="#FFE9D6">KEEP BUILDING. KEEP BURNING.</text>
  </g>
  <rect class="caret" x="94" y="34" width="14" height="30" fill="#FF3B1F"/>
  <text x="94" y="86" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="14" letter-spacing="2" fill="#8A6A64">// building in public since 2024</text>
</svg>
